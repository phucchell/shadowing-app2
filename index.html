<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repeat Recorder</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #f2f2f7 0%, #e5e5ea 100%);
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            transition: all 0.3s ease;
        }

        #recordBtn {
            padding: 24px 48px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 50px;
            border: none;
            background-color: #007aff;
            color: white;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 10px 24px rgba(0, 122, 255, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        #recordBtn:active {
            background-color: #ff3b30;
            box-shadow: 0 6px 16px rgba(255, 59, 48, 0.4);
            transform: scale(0.96);
        }

        #status {
            margin-top: 24px;
            font-size: 15px;
            color: #555;
            font-weight: 600;
            line-height: 1.4;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            width: 100%;
            word-break: break-word;
        }

        #playBtn {
            padding: 0;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            background-color: #34c759;
            color: white;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 8px 16px rgba(52, 199, 89, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            height: 0;
            overflow: hidden;
            margin-top: 0;
        }

        #playBtn.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            height: auto;
            padding: 16px 32px;
            margin-top: 10px;
        }

        #playBtn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 8px rgba(52, 199, 89, 0.2);
        }

        /* Hiệu ứng sóng âm khi ghi âm */
        .recording-wave {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 30px;
            margin-top: 20px;
            opacity: 0;
            transition: all 0.3s ease;
            transform: scale(0.8);
        }

        .recording-wave.active {
            opacity: 1;
            transform: scale(1);
        }

        .bar {
            width: 4px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 2px;
            animation: pulse 0.8s ease-in-out infinite;
        }

        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.3s; }
        .bar:nth-child(4) { animation-delay: 0.4s; }
        .bar:nth-child(5) { animation-delay: 0.5s; }

        @keyframes pulse {
            0%, 100% { height: 8px; }
            50% { height: 28px; }
        }

        /* Khung Debug hiển thị lỗi và trạng thái trực tiếp trên màn hình */
        #debug {
            margin-top: 20px;
            font-family: monospace;
            font-size: 10px;
            color: #555;
            text-align: left;
            width: 100%;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
            word-break: break-all;
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 8px;
            max-height: 120px;
            overflow-y: auto;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1 style="margin: 0 0 5px 0; font-size: 24px; color: #1c1c1e; font-weight: 700;">Repeat Recorder</h1>
        <p style="margin: 0 0 25px 0; font-size: 13px; color: #8e8e93; font-weight: 500; letter-spacing: 0.3px;">Shadowing & Phát âm</p>
        
        <button id="recordBtn">Nhấn giữ để nói</button>
        
        <div class="recording-wave" id="wave">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div id="status">Đang đợi cấp quyền micro...</div>
        
        <button id="playBtn">
            <span>▶</span> Nghe lại
        </button>

        <div id="debug">Đang khởi tạo hệ thống debug...</div>
    </div>

    <audio id="audioPlayback" hidden></audio>

    <script>
        // Hệ thống bắt lỗi toàn cục
        window.onerror = function (message, source, lineno, colno, error) {
            logDebug(`🚨 LỖI TOÀN CỤC:<br>${message}<br>Dòng: ${lineno}:${colno}`);
            return false;
        };

        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let currentAudioUrl = null;
        let mimeType = '';

        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');
        const status = document.getElementById('status');
        const audioPlayback = document.getElementById('audioPlayback');
        const wave = document.getElementById('wave');
        const debugEl = document.getElementById('debug');

        // Hàm log thông tin debug
        const logDebug = (msg) => {
            console.log(msg);
            const time = new Date().toLocaleTimeString();
            debugEl.innerHTML += `[${time}] ${msg}<br>`;
            debugEl.scrollTop = debugEl.scrollHeight; // Cuộn xuống dưới cùng
        };

        logDebug("Ứng dụng bắt đầu.");

        // Khởi tạo Micro một lần duy nhất khi load trang
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaStream = stream;
                status.textContent = 'Sẵn sàng! Nhấn giữ nút để bắt đầu.';
                logDebug("Đã cấp quyền Micro thành công.");

                // Tìm kiếm MIME type được hỗ trợ tốt nhất trên thiết bị
                const types = [
                    'audio/webm;codecs=opus',
                    'audio/webm',
                    'audio/mp4',
                    'audio/ogg',
                    'audio/wav',
                    'audio/aac'
                ];
                for (const type of types) {
                    if (MediaRecorder.isTypeSupported(type)) {
                        mimeType = type;
                        break;
                    }
                }
                logDebug(`Định dạng hỗ trợ được chọn: ${mimeType}`);
            })
            .catch(err => {
                console.error('Lỗi cấp quyền micro:', err);
                status.textContent = 'Lỗi cấp quyền Micro. Hãy tải lại trang và cho phép.';
                logDebug(`❌ Lỗi cấp quyền Micro: ${err.name} - ${err.message}`);
            });

        // Hàm cập nhật giao diện của nút Nghe lại / Tạm dừng
        const updatePlayBtnState = (isPlaying) => {
            if (isPlaying) {
                playBtn.innerHTML = '<span>⏸</span> Tạm dừng';
                playBtn.style.backgroundColor = '#ff9500'; // Đổi sang màu cam khi đang phát
                playBtn.style.boxShadow = '0 8px 16px rgba(255, 149, 0, 0.35)';
                status.textContent = '🎧 Đang phát lại...';
            } else {
                playBtn.innerHTML = '<span>▶</span> Nghe lại';
                playBtn.style.backgroundColor = '#34c759'; // Đổi lại màu xanh lá khi dừng
                playBtn.style.boxShadow = '0 8px 16px rgba(52, 199, 89, 0.35)';
                status.textContent = 'Sẵn sàng! Nhấn giữ nút màu xanh để ghi âm mới.';
            }
        };

        // Xử lý sự kiện nhấn nút Nghe lại (Được coi là cử chỉ người dùng trực tiếp -> 100% hoạt động trên iOS)
        playBtn.addEventListener('click', () => {
            logDebug("Đã nhấn nút 'Nghe lại'.");
            if (audioPlayback.paused) {
                logDebug(`Bắt đầu phát file: ${audioPlayback.src.substring(0, 40)}...`);
                audioPlayback.play().then(() => {
                    logDebug("▶ Âm thanh đang phát.");
                    updatePlayBtnState(true);
                }).catch(err => {
                    console.error('Lỗi khi phát lại:', err);
                    status.innerHTML = `<span style="color: #ff3b30;">Lỗi phát: ${err.name}</span>`;
                    logDebug(`❌ LỖI PHÁT ÂM THANH: ${err.name} - ${err.message}`);
                });
            } else {
                logDebug("Đã nhấn tạm dừng.");
                audioPlayback.pause();
                updatePlayBtnState(false);
            }
        });

        audioPlayback.onended = () => {
            logDebug("⏹ Phát âm thanh kết thúc.");
            updatePlayBtnState(false);
        };

        // Xử lý sự kiện nhấn giữ (hỗ trợ cả trackpad trên Mac và cảm ứng trên iPhone)
        const startRecording = (e) => {
            e.preventDefault();
            logDebug("Bắt đầu nhấn giữ ghi âm.");
            
            // Ẩn nút phát lại cũ khi bắt đầu thu âm mới
            playBtn.classList.remove('visible');
            audioPlayback.pause();
            updatePlayBtnState(false);
            
            if (mediaStream) {
                audioChunks = []; // Reset dữ liệu đệm trước khi thu âm mới
                
                try {
                    const options = mimeType ? { mimeType } : {};
                    mediaRecorder = new MediaRecorder(mediaStream, options);
                    logDebug(`Đã khởi tạo MediaRecorder mới.`);

                    mediaRecorder.ondataavailable = event => {
                        if (event.data && event.data.size > 0) {
                            audioChunks.push(event.data);
                            logDebug(`Nhận chunk: ${event.data.size} bytes. Tổng chunks: ${audioChunks.length}`);
                        }
                    };

                    mediaRecorder.onerror = event => {
                        logDebug(`❌ Lỗi MediaRecorder: ${event.error.name} - ${event.error.message}`);
                    };

                    mediaRecorder.onstop = () => {
                        logDebug(`MediaRecorder đã dừng. Tổng số chunks: ${audioChunks.length}`);
                        const actualMimeType = mediaRecorder.mimeType || mimeType || 'audio/webm';
                        
                        try {
                            const audioBlob = new Blob(audioChunks, { type: actualMimeType });
                            logDebug(`Đã tạo Blob thành công. Kích thước: ${audioBlob.size} bytes. Kiểu: ${audioBlob.type}`);
                            
                            if (currentAudioUrl) {
                                URL.revokeObjectURL(currentAudioUrl);
                            }

                            currentAudioUrl = URL.createObjectURL(audioBlob);
                            audioPlayback.src = currentAudioUrl;
                            logDebug(`Đã gán src thành công: ${currentAudioUrl.substring(0, 45)}...`);
                            
                            // Hiển thị nút phát lại
                            playBtn.classList.add('visible');
                            updatePlayBtnState(false);
                            status.textContent = '🎙️ Đã ghi âm xong! Nhấn "Nghe lại" ở dưới.';
                        } catch (blobErr) {
                            logDebug(`❌ Lỗi tạo Blob/URL: ${blobErr.name} - ${blobErr.message}`);
                        }
                    };

                    mediaRecorder.start();
                    wave.classList.add('active'); // Kích hoạt hiệu ứng sóng âm hoạt họa
                    status.textContent = '🎙️ Đang ghi âm... (Thả ra để lưu)';
                    recordBtn.style.backgroundColor = '#ff3b30';
                    logDebug("MediaRecorder.start() thành công.");
                } catch (recErr) {
                    logDebug(`❌ Lỗi khi khởi động MediaRecorder: ${recErr.name} - ${recErr.message}`);
                }
            } else {
                logDebug("❌ Không thể ghi âm: mediaStream chưa sẵn sàng.");
            }
        };

        const stopRecording = (e) => {
            e.preventDefault();
            logDebug("Đã thả tay ra khỏi nút ghi âm.");
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                try {
                    mediaRecorder.stop();
                    wave.classList.remove('active'); // Tắt sóng âm hoạt họa
                    recordBtn.style.backgroundColor = '#007aff';
                    status.textContent = '⌛ Đang xử lý âm thanh...';
                    logDebug("MediaRecorder.stop() đã gọi.");
                } catch (stopErr) {
                    logDebug(`❌ Lỗi khi gọi MediaRecorder.stop(): ${stopErr.name} - ${stopErr.message}`);
                }
            } else {
                logDebug(`Không thể dừng: mediaRecorder state đang là ${mediaRecorder ? mediaRecorder.state : 'null'}`);
            }
        };

        recordBtn.addEventListener('mousedown', startRecording);
        recordBtn.addEventListener('mouseup', stopRecording);
        recordBtn.addEventListener('touchstart', startRecording, { passive: false });
        recordBtn.addEventListener('touchend', stopRecording, { passive: false });
    </script>
</body>

</html>
